baseURL = "https://ebardann.github.io/"
locale = "en-US"
title = "Emilio Bardán"
theme = "plain"
disableKinds = ["taxonomy", "term"]

# Forthcoming papers often carry a future date; don't silently drop them.
buildFuture = true

[params]
description = "I'm interested in why neural networks work, what structure they discover, how geometry constrains them, and their ability to represent concepts."

[outputs]
home = ["html"]
section = ["html"]

[[menus.main]]
name = "Research"
pageRef = "/research"
weight = 1

[[menus.main]]
name = "Writing"
pageRef = "/writing"
weight = 2

[markup.highlight]
# Emit classes instead of inline colours. The theme styles none of them, so code stays monochrome.
noClasses = false

[markup.goldmark.extensions.passthrough]
enable = true

[markup.goldmark.extensions.passthrough.delimiters]
inline = [['$', '$'], ['\(', '\)']]
block = [['$$', '$$'], ['\[', '\]']]
